name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The protocol module's interop tests build and run the Go side (interop/).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug build
        working-directory: android
        run: ./gradlew :protocol:test :engine:testDebugUnitTest lintDebug :app:assembleDebug
