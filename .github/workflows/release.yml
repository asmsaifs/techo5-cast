name: Release

# Pushing a tag like v0.1.0 builds signed APKs and publishes them as a GitHub Release.
# Needs these repository secrets (docs/releasing.md): CAST_KEYSTORE_BASE64, CAST_KEYSTORE_PASSWORD,
# CAST_KEY_ALIAS, CAST_KEY_PASSWORD.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${tag%%-*}"
          echo "VERSION_NAME=$tag" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Test
        working-directory: android
        run: ./gradlew :protocol:test :engine:testDebugUnitTest lintDebug

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CAST_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APKs
        working-directory: android
        env:
          CAST_KEYSTORE: ${{ runner.temp }}/release.jks
          CAST_KEYSTORE_PASSWORD: ${{ secrets.CAST_KEYSTORE_PASSWORD }}
          CAST_KEY_ALIAS: ${{ secrets.CAST_KEY_ALIAS }}
          CAST_KEY_PASSWORD: ${{ secrets.CAST_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Name and checksum
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "dist/techo5-cast-$VERSION_NAME-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "TECHO5 Cast $VERSION_NAME" "${args[@]}"
